{{- if and .Values.admin.enabled .Values.keycloak.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulsys.fullname" . }}-keycloak
  labels:
    {{- include "pulsys.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: {{ .Values.keycloak.service.type }}
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "pulsys.keycloakSelectorLabels" . | nindent 4 }}
{{- end }}
