suite: keycloak deployment
templates:
  - templates/keycloak-deployment.yaml
  - templates/keycloak-realm-configmap.yaml
# Regression for #46: pod-template labels must not emit duplicate
# app.kubernetes.io/{name,instance} keys (Flux/kubectl strict YAML rejects them).
set:
  proxy.publicBaseURL: https://hf.example.com
  admin.enabled: true
  admin.imports.hfTokenSecret: pulsys-hf
  postgres.host: pg
  postgres.password: test
  console.enabled: false
  keycloak.enabled: true
  oidc.enabled: false
tests:
  - it: renders a keycloak Deployment when admin+keycloak are enabled
    template: templates/keycloak-deployment.yaml
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: metadata.name
          value: RELEASE-NAME-pulsys-keycloak

  - it: pod template labels use a single selector-aligned app.kubernetes.io/name
    template: templates/keycloak-deployment.yaml
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: pulsys-keycloak
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: keycloak
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: pulsys-keycloak
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/name: pulsys-keycloak
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: keycloak
            app.kubernetes.io/part-of: pulsys
            app.kubernetes.io/managed-by: Helm

  - it: omits the keycloak Deployment when keycloak is disabled
    template: templates/keycloak-deployment.yaml
    set:
      keycloak.enabled: false
    asserts:
      - hasDocuments:
          count: 0
