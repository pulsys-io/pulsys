# Dependency review: flags vulnerable or disallowed-license dependencies
# introduced by a pull request before they land on main.
# NOTE: actions are SHA-pinned in the supply-chain hardening pass.

name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Reject copyleft licenses incompatible with Apache-2.0 redistribution.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0
