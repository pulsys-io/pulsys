# OpenSSF Scorecard: continuously grades the repo's security posture
# (branch protection, token permissions, pinned deps, signing, etc.) and
# publishes results to the Scorecard dashboard + code scanning.
# NOTE: actions are SHA-pinned in the supply-chain hardening pass.

name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '21 2 * * 1'   # weekly
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read            # CodeQL upload-sarif telemetry
      contents: read
      security-events: write   # upload SARIF to code scanning
      id-token: write          # publish results to the public dashboard
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: results.sarif
