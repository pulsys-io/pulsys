# Build the Astro marketing site and deploy it to GitHub Pages.
# NOTE: actions are SHA-pinned in the supply-chain hardening pass.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - 'docs/results/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro >= 5.15 requires Node >= 22.12.
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: install
        working-directory: website
        run: npm ci
      - name: build
        working-directory: website
        env:
          PUBLIC_REPO_URL: https://github.com/pulsys-io/pulsys
          # Served at the pulsys.io custom domain root (Settings -> Pages).
          PUBLIC_SITE_URL: https://pulsys.io
          PUBLIC_BASE_PATH: /
        run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
